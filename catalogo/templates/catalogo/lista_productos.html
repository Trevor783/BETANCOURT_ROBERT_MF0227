<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>
</head>
<body>
    <h1>Catálogo de Productos</h1>
    <a href="{% url 'nuevo_producto' %}">+ Añadir nuevo producto</a>
    <br><br>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio Original</th>
                <th>Descuento (%)</th>
                <th>Precio Final</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td>{{ p.precio_original }} €</td>
                <td>{{ p.descuento }} %</td>
                <td><strong>{{ p.precio_final }} €</strong></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay productos registrados todavía.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
